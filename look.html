<script>
/* The piece: a new abstract study on every load, from a random seed. */
(function () {
  var TITLES = ['Quiet Ledger', 'Field With Two Suns', 'Study in Tension', 'Low Tide, Late', 'Paysage Interior',
    'The Long Division', 'Composition for a Monday', 'Weather Over Nothing', 'Second Reading', 'Afterimage',
    'A Small Disagreement', 'Margin Notes', 'Night Inventory', 'Slow Signal', 'Parallel Rooms', 'The Remainder',
    'Undertow', 'Grid Without a Plan', 'Contour of a Quiet Year', 'Torn Minutes', 'Carry the One', 'Reconciled',
    'Harbor at Four', 'Things Held Level', 'The Second Look', 'First Pass', 'Measured Weather', 'Open Items',
    'Where the Lines Agree', 'Late Arithmetic'];
  var host = document.getElementById('piece'), titleEl = document.getElementById('piece-title'), capEl = document.getElementById('piece-caption');
  var NS = 'http://www.w3.org/2000/svg';
  function rng(seed) { return function () { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
  function add(svg, tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
  var ACC = '#D4621A', INK = ['#F2F2F2', '#BDBDBD', '#7A7A7A', '#4A4A4A'];

  function orbits(svg, r) {
    var cx = 180 + r() * 140, cy = 180 + r() * 140, n = 7 + Math.floor(r() * 9);
    for (var i = n; i > 0; i--) add(svg, 'circle', { cx: cx + (r() - .5) * 40, cy: cy + (r() - .5) * 40, r: i * (18 + r() * 16), fill: 'none', stroke: INK[i % 4], 'stroke-width': 1 + r() * 2.5, opacity: .55 + r() * .45 });
    add(svg, 'circle', { cx: 60 + r() * 380, cy: 60 + r() * 380, r: 10 + r() * 26, fill: ACC });
  }
  function strata(svg, r) {
    var y = 30;
    while (y < 470) { var h = 6 + r() * 34, x = r() * 120; add(svg, 'rect', { x: x, y: y, width: 500 - x - r() * 120, height: h, fill: INK[Math.floor(r() * 4)], opacity: .5 + r() * .5 }); y += h + 4 + r() * 18; }
    var ry = 40 + r() * 400; add(svg, 'rect', { x: 20 + r() * 300, y: ry, width: 40 + r() * 120, height: 6 + r() * 14, fill: ACC });
  }
  function scatter(svg, r) {
    var n = 40 + Math.floor(r() * 80);
    for (var i = 0; i < n; i++) { var s = 3 + r() * 30; add(svg, r() > .5 ? 'circle' : 'rect', { cx: r() * 500, cy: r() * 500, r: s / 2, x: r() * 480, y: r() * 480, width: s, height: s, fill: INK[Math.floor(r() * 4)], opacity: .35 + r() * .65 }); }
    add(svg, 'line', { x1: r() * 500, y1: 0, x2: r() * 500, y2: 500, stroke: ACC, 'stroke-width': 2 + r() * 3 });
  }
  function waves(svg, r) {
    var n = 10 + Math.floor(r() * 14), amp = 8 + r() * 30, freq = .01 + r() * .03, ph = r() * 6;
    for (var i = 0; i < n; i++) {
      var y0 = 30 + i * (440 / n), d = 'M0 ' + y0;
      for (var x = 10; x <= 500; x += 10) d += ' L' + x + ' ' + (y0 + Math.sin(x * freq + ph + i * .5) * amp);
      add(svg, 'path', { d: d, fill: 'none', stroke: INK[i % 4], 'stroke-width': 1 + r() * 3, opacity: .6 + r() * .4 });
    }
    var k = Math.floor(r() * n), yk = 30 + k * (440 / n); add(svg, 'circle', { cx: 40 + r() * 420, cy: yk, r: 8 + r() * 14, fill: ACC });
  }
  function grid(svg, r) {
    var c = 5 + Math.floor(r() * 6), s = 440 / c, hit = Math.floor(r() * c * c);
    for (var i = 0; i < c * c; i++) {
      var x = 30 + (i % c) * s, y = 30 + Math.floor(i / c) * s, g = s * (.15 + r() * .7);
      add(svg, r() > .35 ? 'rect' : 'circle', { x: x + (s - g) / 2, y: y + (s - g) / 2, width: g, height: g, cx: x + s / 2, cy: y + s / 2, r: g / 2,
        fill: i === hit ? ACC : INK[Math.floor(r() * 4)], opacity: i === hit ? 1 : .45 + r() * .55 });
    }
  }
  function arcs(svg, r) {
    var n = 6 + Math.floor(r() * 10);
    for (var i = 0; i < n; i++) {
      var cx = r() * 500, cy = r() * 500, rad = 40 + r() * 220, a = r() * 6.28, b = a + .6 + r() * 2.8;
      add(svg, 'path', { d: 'M' + (cx + rad * Math.cos(a)) + ' ' + (cy + rad * Math.sin(a)) + ' A' + rad + ' ' + rad + ' 0 ' + (b - a > 3.14 ? 1 : 0) + ' 1 ' + (cx + rad * Math.cos(b)) + ' ' + (cy + rad * Math.sin(b)),
        fill: 'none', stroke: i === 0 ? ACC : INK[i % 4], 'stroke-width': 2 + r() * 14, 'stroke-linecap': r() > .5 ? 'round' : 'butt', opacity: .55 + r() * .45 });
    }
  }
  function contours(svg, r) {
    var cx = 120 + r() * 260, cy = 120 + r() * 260, n = 9 + Math.floor(r() * 10), w = [r() * 6, r() * 6, r() * 6];
    for (var i = n; i > 0; i--) {
      var base = i * (14 + r() * 10), d = '';
      for (var t = 0; t <= 64; t++) { var a = t / 64 * 6.2832, rr = base * (1 + .12 * Math.sin(3 * a + w[0]) + .08 * Math.sin(5 * a + w[1]) + .05 * Math.sin(2 * a + w[2]));
        d += (t ? ' L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1); }
      add(svg, 'path', { d: d + ' Z', fill: 'none', stroke: i === 2 ? ACC : INK[i % 4], 'stroke-width': i === 2 ? 3 : 1 + r() * 1.5, opacity: .7 });
    }
  }
  function torn(svg, r) {
    var n = 4 + Math.floor(r() * 5), hit = Math.floor(r() * n);
    for (var i = 0; i < n; i++) {
      var x = r() * 360, y = r() * 360, w = 80 + r() * 220, h = 60 + r() * 180, d = 'M' + x + ' ' + y, j;
      for (j = 1; j <= 8; j++) d += ' L' + (x + w * j / 8) + ' ' + (y + (r() - .5) * 12);
      for (j = 1; j <= 8; j++) d += ' L' + (x + w + (r() - .5) * 12) + ' ' + (y + h * j / 8);
      d += ' L' + x + ' ' + (y + h) + ' Z';
      add(svg, 'path', { d: d, fill: i === hit ? ACC : INK[Math.floor(r() * 4)], opacity: i === hit ? .95 : .5 + r() * .5,
        transform: 'rotate(' + ((r() - .5) * 24).toFixed(1) + ' ' + (x + w / 2) + ' ' + (y + h / 2) + ')' });
    }
  }
  /* Tom's own pieces: list them in studies/images.json as [{"src": "studies/name.jpg", "title": "..."}]. */
  var IMAGES = [];
  fetch('studies/images.json', { cache: 'no-store' }).then(function (x) { return x.ok ? x.json() : []; })
    .then(function (a) { IMAGES = Array.isArray(a) ? a.filter(function (i) { return i && i.src; }) : []; }).catch(function () {})
    .then(draw);
  var STYLES = [orbits, strata, scatter, waves, grid, arcs, contours, torn];
  function draw() {
    var seed = Math.floor(Math.random() * 99999) + 1, r = rng(seed);
    if (IMAGES.length && r() < IMAGES.length / (IMAGES.length + STYLES.length)) {
      var im = IMAGES[Math.floor(r() * IMAGES.length)], img = document.createElement('img');
      img.onerror = function () { IMAGES.splice(IMAGES.indexOf(im), 1); draw(); };
      img.src = im.src; img.alt = im.title || 'A TL2 Labs piece';
      host.innerHTML = ''; host.appendChild(img);
      titleEl.textContent = im.title || 'Untitled'; capEl.textContent = im.caption || 'TL2 Labs, from the collection';
      host.setAttribute('aria-label', im.title || 'A TL2 Labs piece');
      return;
    }
    var svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 500 500');
    STYLES[Math.floor(r() * STYLES.length)](svg, r);
    host.innerHTML = ''; host.appendChild(svg);
    titleEl.textContent = TITLES[Math.floor(r() * TITLES.length)];
    capEl.textContent = 'TL2 Labs, Study No. ' + seed;
    host.setAttribute('aria-label', 'A generated abstract study: ' + titleEl.textContent);
  }
  document.getElementById('again').addEventListener('click', draw);
})();

</script>
