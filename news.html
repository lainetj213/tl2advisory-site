<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TL2 Read</title>
<meta name="description" content="Blog and News from TL2 Strategic Advisory.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("tl2-theme");if(t&&t!=="black")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
<link rel="alternate" type="application/rss+xml" title="TL2 Read" href="news/feed.xml">
<script data-goatcounter="https://tl2advisory.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header class="site">
  <a class="mark" href="index.html" aria-label="TL2, home">tl2<i>.</i></a>
  <nav class="top" aria-label="Primary">
    <a href="index.html#look">Look</a>
    <a href="index.html#play">Play</a>
    <a href="news.html" aria-current="page">Read</a>
    <a href="labs.html">Labs</a>
    <a href="signal.html">Signal</a>
  </nav>
  <div class="tools">
    <span class="here" id="here"></span>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Change colors"><span aria-hidden="true"></span></button>
    <button class="moon" id="moon" type="button" aria-label="Tonight’s moon" aria-describedby="moon-tip"></button>
    <div class="moon-tip" id="moon-tip" role="tooltip" hidden></div>
  </div>
</header>

<main class="page">
  <h1>Read</h1>
  <p class="lede">Notes and papers will appear here. <a href="news/feed.xml">RSS</a></p>
  <ul class="posts" id="posts"></ul>
  <p class="muted" id="empty" style="text-align:center">Nothing published yet.</p>
</main>

<footer class="site">
  <p class="motto">Numbers built to be challenged.</p>
  <p>TL II Strategic Advisory LLC &middot; Cincinnati &middot; Veteran-owned</p>
  <p>&copy; <span id="yr">2026</span> &middot; <span class="ver">v8 · 2026.09.29</span></p>
</footer>

<script>
(function () {
  var list = document.getElementById('posts'), empty = document.getElementById('empty');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function fmt(d) {
    var p = String(d || '').split('-');
    if (p.length !== 3) return d || '';
    var dt = new Date(+p[0], +p[1] - 1, +p[2]);
    return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }
  fetch('news/posts.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (rows) {
      rows = (Array.isArray(rows) ? rows : []).slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
      if (!rows.length) return;
      rows.forEach(function (p) {
        var li = el('li'), h = el('h2');
        li.appendChild(el('div', 'date', fmt(p.date)));
        if (p.file) { var a = el('a', null, p.title); a.href = 'news/' + p.file; h.appendChild(a); }
        else h.textContent = p.title;
        if (p.sample) h.appendChild(el('span', 'tag', 'Sample'));
        li.appendChild(h);
        if (p.summary) li.appendChild(el('p', null, p.summary));
        list.appendChild(li);
      });
      empty.hidden = true;
    })
    .catch(function () { empty.hidden = false; });
})();
</script>
<script src="site.js"></script>
</body>
</html>
